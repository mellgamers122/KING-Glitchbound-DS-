name: Build KING Glitchbound NDS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Nintendo DS toolchain
        run: |
          test -x "$DEVKITARM/bin/arm-none-eabi-gcc"
          test -d "$DEVKITPRO/libnds"
      - name: Build Nintendo DS ROM
        run: make
      - name: Verify ROM
        run: |
          test -s KING_Glitchbound.nds
          stat -c "ROM size: %s bytes" KING_Glitchbound.nds
      - name: Upload KING Glitchbound
        uses: actions/upload-artifact@v4
        with:
          name: KING-Glitchbound-NDS
          path: KING_Glitchbound.nds
          if-no-files-found: error
